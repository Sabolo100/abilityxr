server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    # Behind Coolify's reverse proxy: emit relative Location headers so a
    # request for /openclaw-eszter (no trailing slash) is not redirected to
    # the container's internal host:port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/html text/css text/plain;
    gzip_min_length 512;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve directory listings if an index is missing.
    autoindex off;
}
